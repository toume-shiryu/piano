<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<style>
  :root{
    --bg-top:#101726; --bg-bottom:#0b101c;
    --ink:#e9edf5; --ink-sub:#8b94a8;
    --panel:#161e30; --panel-edge:#232d45;
    --rh:#ffb648; --rh-dark:#e09428; --rh-text:#3a2604; --rh-lite:#ffd9a0;
    --lh:#4fc7e8; --lh-dark:#2fa3c6; --lh-text:#062832; --lh-lite:#b8ecf9;
    --hit:#e8465a;
    --loop-a:#7ee787; --loop-b:#c297ff;
    font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg-bottom); color:var(--ink);
    display:flex; flex-direction:column;
    height:100vh; height:100dvh; overflow:hidden;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }

  /* ---- 上部バー(画面に重ねる。再生中は自動的に消える) ---- */
  #bar{
    position:absolute; top:0; left:0; right:0; z-index:4;
    display:flex; align-items:center; gap:6px; flex-wrap:nowrap; min-width:0;
    padding:calc(5px + env(safe-area-inset-top,0px)) calc(8px + env(safe-area-inset-right,0px))
            14px calc(8px + env(safe-area-inset-left,0px));
    background:linear-gradient(rgba(14,20,34,.94),rgba(14,20,34,.72) 62%,rgba(14,20,34,0));
    transition:opacity .22s ease, transform .22s ease;
  }
  body.ui-hidden #bar{opacity:0; transform:translateY(-100%); pointer-events:none;}
  @media (prefers-reduced-motion: reduce){ #bar{transition:none;} }
  button{
    font-family:inherit; font-size:12px; font-weight:700; color:var(--ink);
    background:#1d2740; border:1px solid var(--panel-edge); border-radius:8px;
    padding:6px 9px; cursor:pointer; line-height:1; touch-action:manipulation; white-space:nowrap;
  }
  button:active{background:#2a3760;}
  button:focus-visible{outline:2px solid var(--rh); outline-offset:1px;}
  #playBtn{background:var(--rh); color:var(--rh-text); border-color:var(--rh-dark); font-size:15px; padding:6px 12px; flex:0 0 auto;}
  #seek{flex:1 1 auto; min-width:50px; accent-color:var(--rh); height:24px;}
  #clock{flex:0 0 auto; font-size:10px; color:var(--ink-sub); font-variant-numeric:tabular-nums; white-space:nowrap;}
  #barTitle{
    flex:0 1 auto; font-size:12px; font-weight:700; color:var(--ink-sub);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:22vw;
  }
  @media (max-width:420px){ #barTitle{display:none;} }
  @media (max-width:340px){ #clock{display:none;} }

  /* ---- 描画エリア ---- */
  #stageWrap{
    position:relative; flex:1 1 auto; min-height:0;
    padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #stage{position:absolute; inset:0; width:100%; height:100%; display:block;
         background:linear-gradient(var(--bg-top),var(--bg-bottom)); touch-action:manipulation;}

  /* ---- 設定パネル(重ねて表示・レイアウトを押し広げない) ---- */
  #panel{
    position:absolute; right:8px; top:46px; z-index:6; display:none;
    width:min(290px, calc(100% - 16px)); max-height:calc(100% - 56px); overflow-y:auto;
    background:rgba(20,27,44,.96); border:1px solid var(--panel-edge); border-radius:12px;
    padding:10px 12px 12px; box-shadow:0 12px 30px rgba(0,0,0,.45);
  }
  #panel.open{display:block;}
  #panel h2{font-size:12px; color:var(--ink-sub); font-weight:700; margin:0 0 2px;}
  #panel .meta{font-size:11px; color:var(--ink-sub); margin-bottom:8px; line-height:1.5;}
  .row{display:flex; align-items:center; gap:8px; margin:7px 0; min-height:28px;}
  .row > .lab{flex:0 0 62px; font-size:11px; color:var(--ink-sub);}
  .row input[type=range]{flex:1; min-width:0; accent-color:var(--rh); height:22px;}
  .row output{flex:0 0 52px; text-align:right; font-size:11px; font-variant-numeric:tabular-nums;}
  .row .seg{display:flex; gap:5px; flex:1; flex-wrap:wrap;}
  .row .seg button{flex:1 1 auto;}
  .divider{height:1px; background:var(--panel-edge); margin:10px 0 6px;}
  button.on{border-color:var(--rh); color:var(--rh); background:#22283f;}
  #closeBtn{width:100%; margin-top:10px;}

  #note{font-size:10px; color:var(--ink-sub); line-height:1.55; margin-top:10px;
        border-top:1px solid var(--panel-edge); padding-top:8px;}
  #toast{
    position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:9;
    background:#1d2740; border:1px solid var(--panel-edge); color:var(--ink);
    padding:9px 15px; border-radius:10px; font-size:12.5px; max-width:88vw; text-align:center;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  #toast.show{opacity:1;}
  @media (prefers-reduced-motion: reduce){ #toast{transition:none;} }
</style>
</head>
<body>

<div id="stageWrap">
  <canvas id="stage"></canvas>

  <div id="bar">
  <button id="playBtn" aria-label="再生">▶</button>
  <button id="backBtn" aria-label="前へ">⏪</button>
  <button id="fwdBtn" aria-label="次へ">⏩</button>
  <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="再生位置">
  <span id="clock">0:00/0:00</span>
  <span id="barTitle"></span>
  <button id="fsBtn" aria-label="全画面">⛶</button>
  <button id="gearBtn" aria-label="設定">⚙</button>
  </div>

  <aside id="panel" aria-label="設定">
    <h2 id="pTitle">読み込み中…</h2>
    <div class="meta" id="pMeta"></div>
    <div class="row"><button id="openBtn" style="flex:1">楽譜を開く (.mxl / .musicxml)</button></div>
    <input type="file" id="fileInput" accept=".mxl,.xml,.musicxml" hidden>

    <div class="divider"></div>

    <div class="row"><span class="lab">テンポ</span>
      <input type="range" id="tempo" min="25" max="150" step="5" value="100"><output id="tempoOut">100%</output></div>
    <div class="row"><span class="lab">落下時間</span>
      <input type="range" id="fall" min="2" max="8" step="0.5" value="4"><output id="fallOut">4.0秒</output></div>

    <div class="row"><span class="lab">表示</span><div class="seg">
      <button id="viewBtn">全体表示(固定)</button></div></div>
    <div class="row"><span class="lab">ラベル</span><div class="seg">
      <button id="labelBtn">ドレミ</button><button id="sizeBtn">文字 中</button></div></div>
    <div class="row"><span class="lab">戻る単位</span><div class="seg">
      <button id="unitM" class="on">1小節</button><button id="unitB">1拍</button><button id="unitS">2秒</button></div></div>
    <div class="row"><span class="lab">頭出し</span><div class="seg">
      <button id="rewBtn" style="flex:1">最初に戻る</button></div></div>
    <div class="row"><span class="lab">ループ</span><div class="seg">
      <button id="loopA">A</button><button id="loopB">B</button><button id="loopX">解除</button></div></div>
    <div class="row"><span class="lab">音</span><div class="seg">
      <button id="soundBtn" class="on">ON</button></div></div>

    <button id="closeBtn">閉じる</button>
    <div id="note">画面の<b>左端をタップで1つ戻る</b>、右端で1つ進む、真ん中で再生/一時停止。バーに手を伸ばさずに何度でもやり直せます。<br>
    戻ったあとは1拍手前から始まるので、音符が落ちてくるのを見てから弾けます。</div>
  </aside>
</div>

<div id="toast" role="status"></div>

<script>
"use strict";
/* ============================================================
   ピアノフォール — MusicXML を「降ってくる鍵盤」に変換

// 練習中に画面が消えないようにする
let wakeLock=null;
async function keepAwake(on){
  try{
    if(on&&!wakeLock&&navigator.wakeLock){
      wakeLock=await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release",()=>{wakeLock=null;});
    }else if(!on&&wakeLock){ await wakeLock.release(); wakeLock=null; }
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&state.playing) keepAwake(true);
});
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function toast(msg, ms=3200){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove("show"), ms);
}
function fmtTime(s){
  s=Math.max(0,s); const m=Math.floor(s/60), r=Math.floor(s%60);
  return m+":"+String(r).padStart(2,"0");
}
function b64ToBytes(b64){
  const bin=atob(b64), out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
async function gunzipToText(bytes){
  const ds=new DecompressionStream("gzip");
  return await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
}

// ---------- MusicXML パーサ ----------
const STEP_SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const KANA={C:"ド",D:"レ",E:"ミ",F:"ファ",G:"ソ",A:"ラ",B:"シ"};
const ABC={C:"C",D:"D",E:"E",F:"F",G:"G",A:"A",B:"B"};
function accSym(alter){
  if(alter===1) return "♯"; if(alter===-1) return "♭";
  if(alter===2) return "𝄪"; if(alter===-2) return "♭♭";
  return "";
}

function parseMusicXML(xmlText){
  const doc=new DOMParser().parseFromString(xmlText,"application/xml");
  if(doc.querySelector("parsererror")) throw new Error("XMLの解析に失敗しました");
  const root=doc.querySelector("score-partwise");
  if(!root){
    if(doc.querySelector("score-timewise"))
      throw new Error("timewise形式には未対応です。MuseScore等でpartwise形式で書き出してください");
    throw new Error("MusicXMLが見つかりません");
  }
  const title=(doc.querySelector("work > work-title")?.textContent
            || doc.querySelector("movement-title")?.textContent || "").trim();

  const parts=[...root.querySelectorAll(":scope > part")];
  const rawNotes=[], tempoEvents=[], measuresQ=[];
  const EPS=1e-6;

  parts.forEach((part,pi)=>{
    let div=1, posQ=0, lastStartQ=0, beats=4, beatType=4;
    const openTies=new Map();
    const measures=[...part.children].filter(el=>el.tagName==="measure");
    measures.forEach((meas,mi)=>{
      const measStartQ=posQ; let maxQ=posQ;
      for(const el of meas.children){
        switch(el.tagName){
          case "attributes":{
            const d=el.querySelector(":scope > divisions");
            if(d) div=parseFloat(d.textContent)||div;
            const tm=el.querySelector(":scope > time");
            if(tm){
              beats=parseFloat(tm.querySelector("beats")?.textContent)||beats;
              beatType=parseFloat(tm.querySelector("beat-type")?.textContent)||beatType;
            }
            break;
          }
          case "direction": case "sound":{
            const snd=el.tagName==="sound"?el:el.querySelector("sound");
            const bpm=snd?parseFloat(snd.getAttribute("tempo")):NaN;
            if(bpm>0) tempoEvents.push({q:posQ,bpm});
            break;
          }
          case "backup":
            posQ-=(parseFloat(el.querySelector("duration")?.textContent)||0)/div; break;
          case "forward":
            posQ+=(parseFloat(el.querySelector("duration")?.textContent)||0)/div; break;
          case "note":{
            if(el.querySelector(":scope > grace")) break;
            const durq=(parseFloat(el.querySelector(":scope > duration")?.textContent)||0)/div;
            const isChord=!!el.querySelector(":scope > chord");
            const startQ=isChord?lastStartQ:posQ;
            const advance=()=>{ if(!isChord){ lastStartQ=posQ; posQ+=durq; maxQ=Math.max(maxQ,posQ);} };
            if(el.querySelector(":scope > rest")){ advance(); break; }
            const pitch=el.querySelector(":scope > pitch");
            if(!pitch){ advance(); break; }
            const step=pitch.querySelector("step")?.textContent?.trim()||"C";
            const alter=Math.round(parseFloat(pitch.querySelector("alter")?.textContent||"0"));
            const octave=parseInt(pitch.querySelector("octave")?.textContent||"4",10);
            const midi=(octave+1)*12+(STEP_SEMI[step]??0)+alter;
            const staff=parseInt(el.querySelector(":scope > staff")?.textContent||"1",10);
            const colorKey=(parts.length>1)?(pi%2):(staff>=2?1:0);
            const tieTypes=[...el.querySelectorAll(":scope > tie")].map(t=>t.getAttribute("type"));
            let note=null;
            const prev=openTies.get(midi);
            if(tieTypes.includes("stop") && prev && Math.abs(prev.t0q+prev.durq-startQ)<1e-3){
              prev.durq+=durq; note=prev;
            }else{
              note={t0q:startQ,durq,midi,step,alter,colorKey};
              rawNotes.push(note);
            }
            if(tieTypes.includes("start")) openTies.set(midi,note); else openTies.delete(midi);
            advance(); break;
          }
        }
      }
      if(pi===0) measuresQ.push({q:measStartQ,num:mi+1,beats,beatType});
      posQ=Math.max(posQ,maxQ,measStartQ);
    });
  });

  if(!rawNotes.length) throw new Error("音符が見つかりませんでした");

  tempoEvents.sort((a,b)=>a.q-b.q);
  const tmap=[];
  for(const ev of tempoEvents){
    const last=tmap[tmap.length-1];
    if(last && Math.abs(last.q-ev.q)<EPS) last.bpm=ev.bpm; else tmap.push({...ev});
  }
  if(!tmap.length || tmap[0].q>EPS) tmap.unshift({q:0,bpm:tmap.length?tmap[0].bpm:120});
  let acc=0;
  for(let i=0;i<tmap.length;i++){
    tmap[i].sec=acc;
    const nextQ=(i+1<tmap.length)?tmap[i+1].q:Infinity;
    if(nextQ!==Infinity) acc+=(nextQ-tmap[i].q)*60/tmap[i].bpm;
  }
  const qToSec=q=>{
    let lo=0,hi=tmap.length-1;
    while(lo<hi){ const mid=(lo+hi+1)>>1; if(tmap[mid].q<=q+EPS) lo=mid; else hi=mid-1; }
    const seg=tmap[lo];
    return seg.sec+(q-seg.q)*60/seg.bpm;
  };

  const notes=rawNotes.map(n=>({
    t:qToSec(n.t0q),
    d:Math.max(qToSec(n.t0q+n.durq)-qToSec(n.t0q),0.06),
    midi:n.midi, step:n.step, alter:n.alter, colorKey:n.colorKey
  })).filter(n=>n.midi>=12 && n.midi<=119);
  notes.sort((a,b)=>a.t-b.t || a.midi-b.midi);

  const measureLines=measuresQ.map(m=>({t:qToSec(m.q),num:m.num}));
  const beatLines=[];
  for(let i=0;i<measuresQ.length;i++){
    const m=measuresQ[i];
    const endQ=(i+1<measuresQ.length)?measuresQ[i+1].q:m.q+m.beats*4/m.beatType;
    const stepQ=4/m.beatType;
    for(let q=m.q+stepQ;q<endQ-EPS;q+=stepQ) beatLines.push(qToSec(q));
  }

  return {title,notes,measureLines,beatLines,
          duration:Math.max(...notes.map(n=>n.t+n.d)), bpm0:tmap[0].bpm};
}

async function readScoreFile(file){
  if(file.name.toLowerCase().endsWith(".mxl")){
    if(typeof JSZip==="undefined")
      throw new Error("圧縮形式(.mxl)を展開できませんでした。非圧縮の.musicxmlでお試しください");
    const zip=await JSZip.loadAsync(file);
    let target=null;
    const container=zip.file("META-INF/container.xml");
    if(container){
      const cx=new DOMParser().parseFromString(await container.async("text"),"application/xml");
      const path=cx.querySelector("rootfile")?.getAttribute("full-path");
      if(path && zip.file(path)) target=zip.file(path);
    }
    if(!target) target=Object.values(zip.files).find(f=>!f.dir && !f.name.startsWith("META-INF") && /\.(xml|musicxml)$/i.test(f.name));
    if(!target) throw new Error(".mxl内に楽譜XMLが見つかりません");
    return await target.async("text");
  }
  return await file.text();
}

/* ===== GEOMETRY-BEGIN (鍵盤配置と表示ウィンドウ:単体テスト対象) ===== */
const BLACK=new Set([1,3,6,8,10]);
const WHITE_INDEX={0:0,2:1,4:2,5:3,7:4,9:5,11:6};

// 鍵盤を「白鍵1個=1.0」の座標系で構築する(画面幅に依存しない)
function buildKeyboard(minMidi,maxMidi){
  let lo=clamp(minMidi-2,21,108), hi=clamp(maxMidi+2,21,108);
  while(BLACK.has(((lo%12)+12)%12)) lo--;
  while(BLACK.has(((hi%12)+12)%12)) hi++;
  const whiteOf=m=>{
    const oct=Math.floor(m/12), pc=((m%12)+12)%12;
    return oct*7+(BLACK.has(pc)?WHITE_INDEX[pc-1]:WHITE_INDEX[pc]);
  };
  const w0=whiteOf(lo);
  const whiteCount=whiteOf(hi)-w0+1;
  const keys=new Map();
  for(let m=lo;m<=hi;m++){
    const pc=((m%12)+12)%12;
    if(BLACK.has(pc)){
      const center=(whiteOf(m-1)-w0)+1, uw=0.62;
      keys.set(m,{black:true,u0:center-uw/2,uw});
    }else{
      keys.set(m,{black:false,u0:whiteOf(m)-w0,uw:1});
    }
  }
  return {lo,hi,w0,whiteCount,keys};
}

// 表示ウィンドウ(左端・幅)を決める。need を必ず内側に収めるので音符が画面外に出ない。
function updateView(view,need,cw,whiteCount,dt,snap){
  const minSpan=Math.min(Math.max(11,cw/58),whiteCount);   // 拡大しすぎ防止
  let tgtSpan,tgtCenter;
  if(need){
    tgtSpan=clamp((need.hi-need.lo)+2.2,minSpan,whiteCount);
    tgtCenter=(need.lo+need.hi)/2;
  }else{ tgtSpan=view.span; tgtCenter=view.center; }
  const k=snap?1:(1-Math.exp(-dt/0.85));
  view.span+=(tgtSpan-view.span)*k;
  view.center+=(tgtCenter-view.center)*k;
  if(need){                                                 // 収まらない分は即座に補正
    const needSpan=need.hi-need.lo;
    if(view.span<needSpan) view.span=Math.min(needSpan,whiteCount);
  }
  view.span=clamp(view.span,Math.min(minSpan,whiteCount),whiteCount);
  let left=view.center-view.span/2;
  if(need){
    const loB=need.hi-view.span, hiB=need.lo;
    left=(loB<=hiB)?clamp(left,loB,hiB):(need.lo+need.hi)/2-view.span/2;
  }
  left=clamp(left,0,Math.max(0,whiteCount-view.span));
  view.center=left+view.span/2;
  return left;
}
/* ===== GEOMETRY-END ===== */

// ---------- オーディオ ----------
const audio={
  ctx:null, master:null, active:new Set(),
  ensure(){
    if(this.ctx){ if(this.ctx.state==="suspended") this.ctx.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext;
    this.ctx=new AC();
    const comp=this.ctx.createDynamicsCompressor();
    comp.threshold.value=-18; comp.ratio.value=6;
    this.master=this.ctx.createGain(); this.master.gain.value=0.6;
    this.master.connect(comp); comp.connect(this.ctx.destination);
  },
  play(midi,when,dur){
    const ctx=this.ctx; if(!ctx) return;
    when=Math.max(when,ctx.currentTime+0.005);
    const f=440*Math.pow(2,(midi-69)/12);
    const g=ctx.createGain(), lp=ctx.createBiquadFilter();
    lp.type="lowpass"; lp.frequency.value=Math.min(f*7,9500); lp.Q.value=0.2;
    const o1=ctx.createOscillator(); o1.type="triangle"; o1.frequency.value=f;
    const o2=ctx.createOscillator(); o2.type="sine"; o2.frequency.value=f*2;
    const g2=ctx.createGain(); g2.gain.value=0.25;
    o1.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(this.master);
    const peak=0.32*Math.pow(0.5,(midi-60)/24), end=when+Math.min(dur,2.5)+0.25;
    g.gain.setValueAtTime(0.0001,when);
    g.gain.exponentialRampToValueAtTime(peak,when+0.008);
    g.gain.setTargetAtTime(peak*0.35,when+0.03,0.35);
    g.gain.setTargetAtTime(0.0001,end-0.22,0.06);
    o1.start(when); o2.start(when); o1.stop(end); o2.stop(end);
    const rec={g,o1,o2}; this.active.add(rec);
    o1.onended=()=>{this.active.delete(rec); g.disconnect();};
  },
  stopAll(){
    if(!this.ctx) return;
    const now=this.ctx.currentTime;
    for(const r of this.active){
      try{
        r.g.gain.cancelScheduledValues(now);
        r.g.gain.setTargetAtTime(0.0001,now,0.02);
        r.o1.stop(now+0.08); r.o2.stop(now+0.08);
      }catch(e){}
    }
    this.active.clear();
  }
};

// ---------- 状態 ----------
const state={
  song:null, playing:false, songTime:0, rate:1, fallSec:4,
  labelMode:"doremi", labelSize:1, sound:true,
  autoZoom:false, seekUnit:"measure", view:{center:0,span:40}, snapView:true,
  flash:null,
  loopA:null, loopB:null, schedIdx:0, maxDur:1, kb:null, seeking:false,
};

const canvas=$("stage"), c=canvas.getContext("2d");
let cw=0, ch=0;

function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cw=canvas.clientWidth||1; ch=canvas.clientHeight||1;
  canvas.width=Math.round(cw*dpr); canvas.height=Math.round(ch*dpr);
  c.setTransform(dpr,0,0,dpr,0,0);
  state.snapView=true;
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",()=>setTimeout(resize,250));

// ---------- 読み込み ----------
function loadSong(parsed,displayTitle){
  audio.stopAll();
  state.song=parsed;
  const midis=parsed.notes.map(n=>n.midi);
  state.kb=buildKeyboard(Math.min(...midis),Math.max(...midis));
  state.maxDur=Math.max(...parsed.notes.map(n=>n.d),1);
  state.playing=false; state.schedIdx=0;
  state.loopA=state.loopB=null; updateLoopBtns();
  state.songTime=-state.fallSec;
  state.view={center:state.kb.whiteCount/2,span:state.kb.whiteCount};
  state.snapView=true;
  $("seek").max=parsed.duration.toFixed(1); $("seek").value=0;
  const t=displayTitle||parsed.title||"無題の楽譜";
  $("pTitle").textContent=t; $("barTitle").textContent=t;
  $("pMeta").textContent=`${parsed.notes.length}音 / ${fmtTime(parsed.duration)} / ♩=${Math.round(parsed.bpm0)}`;
  document.title=t+" — ピアノフォール";
  setPlayBtn(); resize();
  toast("読み込み完了:"+t,2600);
}

async function loadEmbedded(){
  try{
    loadSong(parseMusicXML(await gunzipToText(b64ToBytes(EMBEDDED_XML_GZ_B64))),EMBEDDED_TITLE);
  }catch(e){
    console.error(e);
    $("pTitle").textContent="楽譜を開いてください";

}

function schedPointerTo(t){
  const n=state.song.notes; let lo=0,hi=n.length;
  while(lo<hi){ const m=(lo+hi)>>1; if(n[m].t<t) lo=m+1; else hi=m; }
  state.schedIdx=lo;
}
function seekTo(t,keepLead){
  if(!state.song) return;
  audio.stopAll();
  state.songTime=keepLead?t:clamp(t,0,state.song.duration);
  schedPointerTo(state.songTime); state.snapView=true;
}
// 1小節/1拍/2秒 単位で前後に移動する。
// 小節単位のときは1拍手前に着地させるので、戻った直後も音符が落ちてくる時間がある。
function seekStep(dir){
  const s=state, song=s.song; if(!song) return;
  const lead=60/(song.bpm0||120);
  let target;
  if(s.seekUnit==="sec2"){ target=s.songTime+dir*2; }
  else if(s.seekUnit==="beat"){ target=s.songTime+dir*lead; }
  else{
    const mt=s.songTime+lead, lines=song.measureLines;
    let i=0; while(i+1<lines.length&&lines[i+1].t<=mt+1e-3) i++;
    if(dir<0) target=((mt-lines[i].t>0.3)?lines[i].t:(i>0?lines[i-1].t:0))-lead;
    else      target=((i+1<lines.length)?lines[i+1].t:song.duration)-lead;
  }
  seekTo(clamp(target,-s.fallSec,song.duration),true);
  s.flash={dir,at:performance.now()};
}

function togglePlay(){
  if(!state.song) return;
  if(state.playing){ state.playing=false; audio.stopAll(); }
  else{
    audio.ensure();
    if(state.songTime>=state.song.duration) seekTo(-state.fallSec,true);
    schedPointerTo(state.songTime); state.playing=true;
  }
  setPlayBtn(); keepAwake(state.playing); showUI();
}
$("playBtn").addEventListener("click",togglePlay);
$("backBtn").addEventListener("click",()=>seekStep(-1));
$("fwdBtn").addEventListener("click",()=>seekStep(1));
$("rewBtn").addEventListener("click",()=>{ seekTo(-state.fallSec,true); showUI(); });
canvas.addEventListener("pointerdown",e=>{
  if($("panel").classList.contains("open")){ $("panel").classList.remove("open"); showUI(); return; }
  const x=e.clientX-canvas.getBoundingClientRect().left;
  if(x<cw*0.22) seekStep(-1);
  else if(x>cw*0.78) seekStep(1);
  else togglePlay();
});
window.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.code==="Space"){ e.preventDefault(); togglePlay(); }
  if(e.code==="ArrowLeft") seekStep(-1);
  if(e.code==="ArrowRight") seekStep(1);
});
$("seek").addEventListener("input",e=>{ state.seeking=true; seekTo(parseFloat(e.target.value),false); });
$("seek").addEventListener("change",()=>{ state.seeking=false; });

// ---------- 設定パネル ----------
$("bar").addEventListener("pointerdown",showUI);
$("seek").addEventListener("pointerdown",showUI);
$("gearBtn").addEventListener("click",()=>{ $("panel").classList.toggle("open"); showUI(); });
$("closeBtn").addEventListener("click",()=>$("panel").classList.remove("open"));

$("tempo").addEventListener("input",e=>{
  state.rate=parseInt(e.target.value,10)/100;
  $("tempoOut").textContent=e.target.value+"%";
});
$("fall").addEventListener("input",e=>{
  state.fallSec=parseFloat(e.target.value);
  $("fallOut").textContent=state.fallSec.toFixed(1)+"秒";
});
$("viewBtn").addEventListener("click",()=>{
  state.autoZoom=!state.autoZoom; state.snapView=true;
  $("viewBtn").textContent=state.autoZoom?"自動ズーム":"全体表示(固定)";
  $("viewBtn").classList.toggle("on",state.autoZoom);
});
$("labelBtn").addEventListener("click",()=>{
  state.labelMode=state.labelMode==="doremi"?"abc":state.labelMode==="abc"?"off":"doremi";
  $("labelBtn").textContent=state.labelMode==="doremi"?"ドレミ":state.labelMode==="abc"?"CDE":"なし";
});
$("sizeBtn").addEventListener("click",()=>{
  state.labelSize=state.labelSize>=2?0:state.labelSize+1;
  $("sizeBtn").textContent="文字 "+["小","中","大"][state.labelSize];
});
const UNITS={unitM:"measure",unitB:"beat",unitS:"sec2"};
for(const id of Object.keys(UNITS)){
  $(id).addEventListener("click",()=>{
    state.seekUnit=UNITS[id];
    for(const k of Object.keys(UNITS)) $(k).classList.toggle("on",k===id);
  });
}

function updateLoopBtns(){
  $("loopA").classList.toggle("on",state.loopA!=null);
  $("loopB").classList.toggle("on",state.loopB!=null);
  $("loopA").textContent=state.loopA!=null?"A "+fmtTime(state.loopA):"A";
  $("loopB").textContent=state.loopB!=null?"B "+fmtTime(state.loopB):"B";
}
$("loopA").addEventListener("click",()=>{
  if(!state.song) return;
  state.loopA=clamp(state.songTime,0,state.song.duration);
  if(state.loopB!=null&&state.loopB<=state.loopA) state.loopB=null;
  updateLoopBtns(); toast("ループ開始:"+fmtTime(state.loopA),2000);
});
$("loopB").addEventListener("click",()=>{
  if(!state.song) return;
  const t=clamp(state.songTime,0,state.song.duration);
  if(state.loopA==null||t<=state.loopA){ toast("先にAを設定してください",2200); return; }
  state.loopB=t; updateLoopBtns(); toast("ループ "+fmtTime(state.loopA)+"〜"+fmtTime(state.loopB),2200);
});
$("loopX").addEventListener("click",()=>{ state.loopA=state.loopB=null; updateLoopBtns(); });
$("soundBtn").addEventListener("click",()=>{
  state.sound=!state.sound;
  $("soundBtn").textContent=state.sound?"ON":"OFF";
  $("soundBtn").classList.toggle("on",state.sound);
  if(!state.sound) audio.stopAll();
});
const fsEl=document.documentElement;
if(standalone || (!fsEl.requestFullscreen && !fsEl.webkitRequestFullscreen)) $("fsBtn").style.display="none";
$("fsBtn").addEventListener("click",async()=>{
  try{
    if(document.fullscreenElement||document.webkitFullscreenElement){
      await (document.exitFullscreen?.()||document.webkitExitFullscreen?.());
    }else{
      await (fsEl.requestFullscreen?.()||fsEl.webkitRequestFullscreen?.());
      try{ await screen.orientation?.lock?.("landscape"); }catch(e){}
    }
    setTimeout(resize,300);
  }catch(e){ toast("この環境では全画面にできません",2500); }
});

// ---------- ラベル描画 ----------
const CSSV=getComputedStyle(document.documentElement);
const COLORS=[
  {fill:CSSV.getPropertyValue("--rh").trim(), dark:CSSV.getPropertyValue("--rh-dark").trim(),
   text:CSSV.getPropertyValue("--rh-text").trim(), lite:CSSV.getPropertyValue("--rh-lite").trim()},
  {fill:CSSV.getPropertyValue("--lh").trim(), dark:CSSV.getPropertyValue("--lh-dark").trim(),
   text:CSSV.getPropertyValue("--lh-text").trim(), lite:CSSV.getPropertyValue("--lh-lite").trim()},
];
const HIT=CSSV.getPropertyValue("--hit").trim();
const HALO="#080c15";
const LABEL_FAMILY="'Hiragino Maru Gothic ProN','BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif";
const fontOf=fs=>"700 "+fs.toFixed(1)+"px "+LABEL_FAMILY;
const ACC=0.66;                                   // 臨時記号は小さめに添える
const _ratio=new Map();
function widthRatio(txt){                          // 1pxフォント時の文字幅
  let r=_ratio.get(txt);
  if(r===undefined){ c.font=fontOf(100); r=c.measureText(txt).width/100; _ratio.set(txt,r); }
  return r;
}
function labelParts(n,mode){
  if(mode==="off") return null;
  return {base:(mode==="doremi"?KANA[n.step]:ABC[n.step]), acc:accSym(n.alter)};
}
const partsRatio=p=>widthRatio(p.base)+(p.acc?widthRatio(p.acc)*ACC:0);

// (cx,cy)を中心に、基音+臨時記号を1つの塊として描く
function paintLabel(p,cx,cy,fs,color,halo){
  const wb=widthRatio(p.base)*fs, wa=p.acc?widthRatio(p.acc)*fs*ACC:0;
  let x=cx-(wb+wa)/2;
  c.textAlign="left"; c.textBaseline="middle";
  if(halo){ c.lineWidth=Math.max(1.8,fs*0.22); c.lineJoin="round"; c.strokeStyle=halo; }
  c.font=fontOf(fs);
  if(halo) c.strokeText(p.base,x,cy);
  c.fillStyle=color; c.fillText(p.base,x,cy);
  if(p.acc){
    c.font=fontOf(fs*ACC);
    const ay=cy-fs*0.24;
    if(halo) c.strokeText(p.acc,x+wb,ay);
    c.fillStyle=color; c.fillText(p.acc,x+wb,ay);
  }
}

// 既に置いたラベルの矩形(毎フレームクリア)。重なりを防ぐために使う。
let _placed=[];
function overlapFrac(a,b){
  const ox=Math.min(a.x1,b.x1)-Math.max(a.x0,b.x0);
  const oy=Math.min(a.y1,b.y1)-Math.max(a.y0,b.y0);
  if(ox<=0||oy<=0) return 0;
  return (ox*oy)/Math.max((a.x1-a.x0)*(a.y1-a.y0),1);
}
function place(r,avoid){
  if(avoid){ for(const q of _placed) if(overlapFrac(r,q)>0.32) return false; }
  _placed.push(r); return true;
}

/* 音符に対してラベルを描く。
   1. 音符の幅と高さに収まるなら内側に濃い文字で(音符でクリップ=背景にはみ出さない)
   2. 収まらない細い/短い音符は、縁取り付きの明るい文字を音符に重ねる
      (横幅は最大2倍まで許容。ただし既存ラベルと重なる場合は描かない)
   どちらも不可能なほど小さいときは、読めない文字を出すより描かない。 */
function drawNoteLabel(p,x,w,yT,yB,col,hitY){
  const FS_MAX=[13,17,22][state.labelSize];
  const MIN=[8,8.5,9][state.labelSize];
  const ratio=partsRatio(p), h=yB-yT, cx=x+w/2;

  const fsIn=Math.min(FS_MAX,(w-4)/ratio,h-3);
  if(fsIn>=MIN){                                   // 1) 内側に収める
    const cy=clamp((yT+yB)/2,fsIn*0.6,hitY-2), tw=ratio*fsIn;
    c.save(); c.beginPath(); c.rect(x,yT,w,h); c.clip();
    paintLabel(p,cx,cy,fsIn,col.text,null);
    c.restore();
    place({x0:cx-tw/2,x1:cx+tw/2,y0:cy-fsIn*0.6,y1:cy+fsIn*0.6},false);
    return;
  }
  const fs=Math.min(FS_MAX*0.8,(w*2.0)/ratio,14);  // 2) 縁取りで重ねる
  if(fs>=MIN){
    const tall=h>=fs+5;
    const cy=clamp(tall?(yT+yB)/2:Math.min(yB,hitY)-fs*0.58,fs*0.62,hitY-fs*0.5);
    const tw=ratio*fs;
    const r={x0:cx-tw/2,x1:cx+tw/2,y0:cy-fs*0.62,y1:cy+fs*0.62};
    if(place(r,true)) paintLabel(p,cx,cy,fs,col.lite,HALO);
  }
}

function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath(); c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}

// ---------- 表示範囲の更新 ----------
function neededRange(now,topT){
  const {notes}=state.song, {keys}=state.kb;
  let lo=0,hi=notes.length;
  const from=now-state.maxDur-0.2;
  while(lo<hi){ const m=(lo+hi)>>1; if(notes[m].t<from) lo=m+1; else hi=m; }
  let mn=Infinity,mx=-Infinity;
  for(let i=lo;i<notes.length;i++){
    const n=notes[i];
    if(n.t>topT) break;
    if(n.t+n.d<=now-0.1) continue;
    const k=keys.get(n.midi); if(!k) continue;
    if(k.u0<mn) mn=k.u0;
    if(k.u0+k.uw>mx) mx=k.u0+k.uw;
  }
  return mn<=mx?{lo:mn,hi:mx}:null;
}

// ---------- 描画 ----------
function draw(dt){
  c.clearRect(0,0,cw,ch);
  if(!state.song||!state.kb) return;

  const kbH=Math.min(clamp(ch*0.20,52,110),ch*0.32);
  const hitY=ch-kbH, laneH=hitY, pps=laneH/state.fallSec;
  const now=state.songTime, topT=now+state.fallSec;
  const {whiteCount,keys}=state.kb;

  let left, ww;
  if(state.autoZoom){
    left=updateView(state.view,neededRange(now,topT),cw,whiteCount,dt,state.snapView);
    ww=cw/state.view.span;
  }else{
    state.view.span=whiteCount; state.view.center=whiteCount/2; left=0; ww=cw/whiteCount;
  }
  state.snapView=false;
  const px=u=>(u-left)*ww;

  // 拍線・小節線
  for(const bt of state.song.beatLines){
    if(bt<now-0.2||bt>topT) continue;
    const y=hitY-(bt-now)*pps;
    c.strokeStyle="rgba(139,148,168,0.09)"; c.lineWidth=1;
    c.beginPath(); c.moveTo(0,y); c.lineTo(cw,y); c.stroke();
  }
  c.textBaseline="middle"; c.textAlign="left"; c.font="10px system-ui,sans-serif";
  for(const ml of state.song.measureLines){
    if(ml.t<now-0.2||ml.t>topT) continue;
    const y=hitY-(ml.t-now)*pps;
    c.strokeStyle="rgba(139,148,168,0.26)"; c.lineWidth=1;
    c.beginPath(); c.moveTo(0,y); c.lineTo(cw,y); c.stroke();
    c.fillStyle="rgba(139,148,168,0.65)"; c.fillText(String(ml.num),5,y-8);
  }

  // A/Bループ
  const marker=(t,color)=>{
    if(t==null||t<now-0.2||t>topT) return;
    const y=hitY-(t-now)*pps;
    c.strokeStyle=color; c.lineWidth=2; c.setLineDash([6,4]);
    c.beginPath(); c.moveTo(0,y); c.lineTo(cw,y); c.stroke(); c.setLineDash([]);
  };
  marker(state.loopA,CSSV.getPropertyValue("--loop-a").trim());
  marker(state.loopB,CSSV.getPropertyValue("--loop-b").trim());

  // 降ってくる音符
  const notes=state.song.notes;
  let lo=0,hi=notes.length;
  const from=now-state.maxDur-0.2;
  while(lo<hi){ const m=(lo+hi)>>1; if(notes[m].t<from) lo=m+1; else hi=m; }
  const activeKeys=new Map();
  const pending=[];
  for(let i=lo;i<notes.length;i++){
    const n=notes[i];
    if(n.t>topT) break;
    const end=n.t+n.d;
    if(end<=now) continue;
    const key=keys.get(n.midi); if(!key) continue;
    const x=px(key.u0)+1.5, w=key.uw*ww-3;
    if(x+w<-2||x>cw+2) continue;
    const col=COLORS[n.colorKey%COLORS.length];
    if(n.t<=now&&now<end&&!activeKeys.has(n.midi)) activeKeys.set(n.midi,col);
    let yB=Math.min(hitY-(n.t-now)*pps,hitY);
    let yT=Math.max(hitY-(end-now)*pps,-40);
    const h=yB-yT; if(h<=0) continue;
    c.fillStyle=key.black?col.dark:col.fill;
    roundRect(x,yT,w,Math.max(h,4),Math.min(5,w/3));
    if(n.t<=now&&now<end){ c.save(); c.shadowColor=col.fill; c.shadowBlur=14; c.fill(); c.restore(); }
    else c.fill();
    c.strokeStyle="rgba(0,0,0,0.38)"; c.lineWidth=1; c.stroke();
    const p=labelParts(n,state.labelMode);
    if(p) pending.push({p,x,w,yT,yB,col});
  }
  _placed.length=0;
  for(const it of pending) drawNoteLabel(it.p,it.x,it.w,it.yT,it.yB,it.col,hitY);

  // ヒットライン
  c.strokeStyle=HIT; c.lineWidth=2;
  c.beginPath(); c.moveTo(0,hitY); c.lineTo(cw,hitY); c.stroke();

  // 鍵盤
  c.textAlign="center"; c.textBaseline="alphabetic";
  for(const [m,k] of keys){
    if(k.black) continue;
    const x=px(k.u0), w=k.uw*ww;
    if(x+w<0||x>cw) continue;
    const on=activeKeys.get(m);
    c.fillStyle=on?on.fill:"#f5f1e8";
    c.fillRect(x,hitY,w,kbH);
    c.strokeStyle="#c9c2b4"; c.lineWidth=1; c.strokeRect(x+0.5,hitY+0.5,w-1,kbH-1);
    if(m%12===0){                                   // 各オクターブのドに目印
      c.fillStyle=on?"rgba(0,0,0,0.6)":"#b3a98f";
      if(w>=13){
        c.font="600 "+clamp(w*0.34,8,12).toFixed(1)+"px "+LABEL_FAMILY;
        c.fillText(w>=22?"ド"+(Math.floor(m/12)-1):"ド",x+w/2,hitY+kbH-8);
      }else{
        c.beginPath(); c.arc(x+w/2,hitY+kbH-8,Math.max(1.6,w*0.16),0,Math.PI*2); c.fill();
      }
    }
  }
  const bh=kbH*0.62;
  for(const [m,k] of keys){
    if(!k.black) continue;
    const x=px(k.u0), w=k.uw*ww;
    if(x+w<0||x>cw) continue;
    const on=activeKeys.get(m);
    c.fillStyle=on?on.dark:"#1a1e28";
    roundRect(x,hitY,w,bh,Math.min(3,w/3)); c.fill();
    if(on){ c.strokeStyle=on.fill; c.lineWidth=1.5; c.stroke(); }
  }

  // 左右端のタップゾーン(戻る/進む)の目印と、押したときの反応
  const zw=cw*0.22, cyZ=hitY*0.45;
  const unitLabel=state.seekUnit==="measure"?"1小節":state.seekUnit==="beat"?"1拍":"2秒";
  const fl=state.flash, age=fl?(performance.now()-fl.at)/420:2;
  c.textAlign="center"; c.textBaseline="middle";
  for(const side of [-1,1]){
    const cxZ=side<0?zw*0.5:cw-zw*0.5;
    const active=!!fl&&fl.dir===side&&age<1;
    if(active){
      const x0=side<0?0:cw-zw*1.5;
      const g=c.createLinearGradient(side<0?0:cw,0,side<0?zw*1.5:cw-zw*1.5,0);
      g.addColorStop(0,"rgba(233,237,245,"+((1-age)*0.15).toFixed(3)+")");
      g.addColorStop(1,"rgba(233,237,245,0)");
      c.fillStyle=g; c.fillRect(x0,0,zw*1.5,hitY);
    }
    c.fillStyle="rgba(233,237,245,"+(active?(0.25+0.7*(1-age)).toFixed(3):"0.15")+")";
    c.font="600 "+clamp(cw*0.028,13,22).toFixed(1)+"px system-ui,sans-serif";
    c.fillText(side<0?"◀◀":"▶▶",cxZ,cyZ);
    if(active){
      c.font="700 "+clamp(cw*0.019,10,14).toFixed(1)+"px "+LABEL_FAMILY;
      c.fillText(unitLabel,cxZ,cyZ+20);
    }
  }
}

// ---------- メインループ ----------
let prevTs=null;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=prevTs==null?0:Math.min((ts-prevTs)/1000,0.1);
  prevTs=ts;
  const s=state;
  if(s.song&&s.playing){
    s.songTime+=dt*s.rate;
    if(s.loopA!=null&&s.loopB!=null&&s.songTime>=s.loopB) seekTo(Math.max(s.loopA-0.6,-s.fallSec),true);
    if(audio.ctx){
      const lookAhead=0.25*s.rate, notes=s.song.notes;
      while(s.schedIdx<notes.length&&notes[s.schedIdx].t<=s.songTime+lookAhead){
        const n=notes[s.schedIdx++];
        if(s.sound&&n.t+n.d>s.songTime)
          audio.play(n.midi,audio.ctx.currentTime+Math.max(n.t-s.songTime,0)/s.rate,n.d/s.rate);
      }
    }
    if(s.songTime>s.song.duration+1.5){ s.playing=false; setPlayBtn(); audio.stopAll(); keepAwake(false); showUI(); }
    if(!s.seeking) $("seek").value=clamp(s.songTime,0,s.song.duration).toFixed(1);
  }
  if(s.song) $("clock").textContent=fmtTime(clamp(s.songTime,0,s.song.duration))+"/"+fmtTime(s.song.duration);
  draw(dt);
}

if(location.protocol.startsWith("http")){
  try{
    const manifest={name:"ピアノフォール",short_name:"ピアノフォール",display:"fullscreen",
      orientation:"landscape",background_color:"#0b101c",theme_color:"#0b101c",
      start_url:location.href.split("#")[0],
      icons:[{src:APP_ICON,sizes:"180x180",type:"image/png",purpose:"any"}]};
    const link=document.createElement("link"); link.rel="manifest";
    link.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"}));
    document.head.appendChild(link);
  }catch(e){}
}

resize();
requestAnimationFrame(frame);
loadEmbedded();
showUI();
if(window.innerHeight>window.innerWidth&&window.innerWidth<520)
  setTimeout(()=>toast("横向きにすると音符が大きく表示されます",4000),3000);
</script>
